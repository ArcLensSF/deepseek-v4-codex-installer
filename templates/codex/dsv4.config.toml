# Install as ~/.codex/dsv4.config.toml, then run: codex --profile dsv4
# DSV4_API_KEY must be set in the launching shell; do not put it in this file.

model = "dsv4-abliterated"
model_provider = "dsv4"
model_context_window = 524288
model_supports_reasoning_summaries = false

[model_providers.dsv4]
name = "Private DeepSeek V4"
base_url = "http://127.0.0.1:4000/v1"
env_key = "DSV4_API_KEY"
wire_api = "responses"
request_max_retries = 2
stream_max_retries = 2
