# Generated by install.sh at <DSV4_ROOT>/config/litellm.yaml.
# The API key comes only from systemd's protected EnvironmentFile.
model_list:
  - model_name: dsv4-abliterated
    litellm_params:
      model: openai/dsv4-abliterated
      api_base: http://127.0.0.1:8000/v1
      api_key: dsv4-loopback-backend
litellm_settings:
  master_key: os.environ/DSV4_API_KEY
  drop_params: true
general_settings:
  disable_spend_logs: true
